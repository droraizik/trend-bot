name: Daily trend bot

on:
  schedule:
    - cron: "20 8 * * *"   # 11:20 in Israel during summer time
    - cron: "20 9 * * *"   # 11:20 in Israel during winter time
  workflow_dispatch:
  push:
    branches: [main]
    # rebuild the page right away when the bot's code changes
    paths: ["trend_bot.py", "Functions/**", "dashboard_template.html", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        # GitHub only knows UTC, so both times are scheduled and only the one that is 11:20 in Israel today goes ahead
        run: |
          offset=$(TZ=Asia/Jerusalem date +%z)
          trigger="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$offset" = "+0300" ] && [ "$trigger" = "20 8 * * *" ]; } \
             || { [ "$offset" = "+0200" ] && [ "$trigger" = "20 9 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  run-bot:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python trend_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the new page and decision log
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add docs
          git commit -m "Daily update $(date -u +%F)" || echo "Nothing changed"
          git push
