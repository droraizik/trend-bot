name: Daily trend bot

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, after the US market closes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python trend_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the new page and decision log
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add docs
          git commit -m "Daily update $(date -u +%F)" || echo "Nothing changed"
          git push
